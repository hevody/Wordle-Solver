<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Solver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
        background-color: #2C3947;
        font-family: Arial, Helvetica, sans-serif;
        color: #E8EDF2;
        font-size: 25px;
      }
    h1 {
      color: #C2A56D;
      font-family: "Press Start 2P", system-ui;
      font-weight: 400;
      font-style: normal;
    }    
    button {
      background-color: #C2A56D;
      font-family: Arial, Helvetica, sans-serif;
      color: #E8EDF2;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 10px 25px;
      border-radius: 8px;
    }
  </style>

</head>
<body>
  <h1>Wordle Solver...</h1>
  <p>Welcome, come let's solve today's wordle!</p>
  <br>
  <br>
  <form class="grid-form" action="/" method="POST">
    <label for="known_letters">known letters: </label>
    <input type="text", id="known_letters", name="known_letters_input">
    <br>
    <label for="bad_letters">bad letters: </label>
    <input type="text", id="bad_letters", name="bad_letters_input">
    <br>
    <label for="clue_letters">clue letters: </label>
    <input type="text", id="clue_letters", name="clue_letters_input">
    <br>
    <br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
